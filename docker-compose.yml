services:
  db:
    image: mysql:8.0
    container_name: Database_container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: user
      MYSQL_PASSWORD: userpassword
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 5

  api:
    image: louniverse/arbeidskrav-api:latest
    build:
      context: ./Arbeidskrav.Api
      dockerfile: Dockerfile
    depends_on:
     db:
      condition: service_healthy

  nginx:
    image: nginx:latest
    container_name: nginx_container
    build:
      context:  ./nginx
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  db_data: